<svg xmlns="http://www.w3.org/2000/svg" width="840" height="224" viewBox="0 0 840 224" cursor="default" role="img" aria-labelledby="gitvis-title" aria-describedby="gitvis-desc"><title id="gitvis-title">Contribution activity</title><desc id="gitvis-desc">223 contributions across GitHub @jenkruk and GitLab @contactkruk from Nov 7, 2025 to Nov 6, 2026. GitHub 120, GitLab 103. 65 active days. Longest streak: 2 days. Best day: 9 on Oct 16, 2026.</desc><rect x="0.5" y="0.5" width="839" height="223" rx="14" fill="#0a111e" stroke="#1f2c45"></rect><g><text x="24" y="39" font-size="16" font-weight="600" fill="#e6f1ff" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Contribution activity</text><text x="24" y="58" font-size="11" fill="#94a6bd" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><tspan>Nov 7, 2025 – Nov 6, 2026</tspan><tspan><tspan dx="10" fill="#5eead4">●</tspan><tspan dx="4" fill="#e6f1ff">GitHub</tspan><tspan dx="4">@jenkruk</tspan></tspan><tspan><tspan dx="10" fill="#60a5fa">●</tspan><tspan dx="4" fill="#e6f1ff">GitLab</tspan><tspan dx="4">@contactkruk</tspan></tspan></text></g><g><g><g><rect x="24" y="80" width="792" height="70" rx="10" fill="#101a2c" stroke="#1f2c45"></rect><text x="40" y="102" font-size="11" font-weight="500" fill="#94a6bd" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Contributions</text><text x="40" y="130" font-size="22" font-weight="700" fill="#e6f1ff" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">223</text></g></g></g><g><text font-size="10" fill="#94a6bd" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><tspan x="24" y="176">Contributions as reported by each platform, not commits. Platforms count different activities; totals aren’t deduplicated.</tspan></text></g><text x="24" y=