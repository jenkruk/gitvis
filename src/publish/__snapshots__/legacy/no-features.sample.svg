<svg xmlns="http://www.w3.org/2000/svg" width="840" height="152" viewBox="0 0 840 152" role="img" aria-labelledby="gitvis-title" aria-describedby="gitvis-desc"><title id="gitvis-title">Contribution activity</title><desc id="gitvis-desc">Sample data, not real activity. 718 contributions across GitHub @sample-github and GitLab @sample-gitlab from Nov 1, 2025 to Oct 31, 2026. GitHub 405, GitLab 313. 143 active days. Longest streak: 7 days. Best day: 14 on Aug 28, 2026.</desc><rect x="0.5" y="0.5" width="839" height="151" rx="14" fill="#0a111e" stroke="#1f2c45"></rect><g><text x="24" y="39" font-size="16" font-weight="600" fill="#e6f1ff" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Contribution activity</text><text x="24" y="58" font-size="11" fill="#94a6bd" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><tspan>Nov 1, 2025 – Oct 31, 2026</tspan><tspan><tspan dx="10" fill="#5eead4">●</tspan><tspan dx="4" fill="#e6f1ff">GitHub</tspan><tspan dx="4">@sample-github</tspan></tspan><tspan><tspan dx="10" fill="#60a5fa">●</tspan><tspan dx="4" fill="#e6f1ff">GitLab</tspan><tspan dx="4">@sample-gitlab</tspan></tspan></text><g><rect x="732" y="24" width="84" height="22" rx="11" fill="#101a2c" stroke="#5eead4"></rect><text x="774" y="39" text-anchor="middle" font-size="11" font-weight="600" fill="#e6f1ff" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Sample data</text></g></g><g><text font-size="10" fill="#94a6bd" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><tspan x="24" y="90">Contributions as reported by each platform, not commits. Platforms count different activities; totals aren’t deduplicated.</tspan></text></g><text x="24" y="136" font-size="12" fill="#94a6bd" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><tspan>Made with GitVis · created by Jen Kruk ·</tspan><tspan dx="4" fill="#e6f1ff" font-weight="600">Get yours!</tspan></text></svg>